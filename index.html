<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অপ্রকাশিত — Living Virtual Library</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/bookshelf.css">
  
  <style>
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
      font-family: var(--font-bengali);
    }
    header.main-header {
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-glass);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--color-primary);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="main-header">
    <a href="index.html" class="brand-logo">অপ্রকাশিত.</a>
    <div>
      <a href="admin.html" style="color: var(--color-primary); text-decoration: none; font-weight: 600;">অ্যাডমিন প্যানেল</a>
    </div>
  </header>

  <!-- Main Dynamic 3D Virtual Library Shelves Area -->
  <main class="virtual-library-container" id="bookshelfShelvesContainer"></main>

  <!-- Firebase compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <!-- Oprokashi Engine Scripts -->
  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/bookshelf.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Initialize Bookshelf Renderer on Load
      if (window.BookshelfEngine) {
        window.BookshelfEngine.init("bookshelfShelvesContainer");
      }
    });
  </script>
</body>
</html>
