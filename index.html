<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অপ্রকাশিত — গল্পের এক অন্য দুনিয়া</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:,">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-color: #58a6ff;
      --border-color: #30363d;
      --chip-bg: #21262d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Hind Siliguri', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
      width: 100%;
    }

    /* Navbar */
    .navbar {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 18px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
    }

    .logo span {
      color: var(--accent-color);
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 500;
      transition: color 0.3s;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--text-main);
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 50px 0 30px;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 25px;
    }

    /* Search & Filter Bar */
    .search-box {
      max-width: 500px;
      margin: 0 auto 20px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 20px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 25px;
      color: var(--text-main);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-box input:focus {
      border-color: var(--accent-color);
    }

    .categories {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .cat-btn {
      background-color: var(--chip-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 6px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.3s;
    }

    .cat-btn:hover, .cat-btn.active {
      background-color: var(--accent-color);
      color: #000;
      border-color: var(--accent-color);
      font-weight: 600;
    }

    /* Section Header */
    .section-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    /* Story Grid & Cards */
    .stories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }

    .story-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .story-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-color);
    }

    .story-title {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: var(--text-main);
      line-height: 1.4;
    }

    .story-excerpt {
      color: var(--text-muted);
      font-size: 0.98rem;
      margin-bottom: 20px;
      white-space: pre-line;
      word-break: break-word;
    }

    .story-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }

    .story-meta strong {
      color: var(--accent-color);
    }

    /* Footer */
    footer {
      margin-top: auto;
      border-top: 1px solid var(--border-color);
      padding: 25px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      background-color: var(--card-bg);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">অপ্রকাশিত<span>.</span></a>
      <ul class="nav-links">
        <li><a href="index.html" class="active">হোম</a></li>
      </ul>
    </div>
  </nav>

  <!-- Hero & Filters -->
  <div class="container">
    <header class="hero">
      <h1>অপ্রকাশিত অনুভূতির গল্পমালা</h1>
      <p>শব্দে সাজানো হাজারো অপ্রকাশিত অনুভূতি এবং রোমাঞ্চকর গল্পের সমাহার</p>
      
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="গল্পের নাম বা কিওয়ার্ড দিয়ে খুঁজুন...">
      </div>

      <div class="categories" id="categoryFilter">
        <button class="cat-btn active" data-category="সব">সব গল্প</button>
        <button class="cat-btn" data-category="রোমান্টিক">রোমান্টিক</button>
        <button class="cat-btn" data-category="থ্রিলার">থ্রিলার</button>
        <button class="cat-btn" data-category="হরর">হরর</button>
        <button class="cat-btn" data-category="জীবনমুখী">জীবনমুখী</button>
        <button class="cat-btn" data-category="অন্যান্য">অন্যান্য</button>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <h2 class="section-title">সর্বশেষ গল্পসমূহ</h2>
      <div class="stories-grid" id="storiesGrid">
        <p style="text-align:center; grid-column:1/-1; color:var(--text-muted);">গল্প লোড হচ্ছে...</p>
      </div>
    </main>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 অপ্রকাশিত। সর্বস্বত্ব সংরক্ষিত।</p>
    </div>
  </footer>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAliz-F-qzpblysGFB4Yephlo4hVPz_7Z0",
      authDomain: "oprokashi-to.firebaseapp.com",
      projectId: "oprokashi-to",
      storageBucket: "oprokashi-to.firebasestorage.app",
      messagingSenderId: "739451365790",
      appId: "1:739451365790:web:1989b3da7ca6a1eab8be8f",
      measurementId: "G-B6JZ36V59E"
    };

    // Firebase Initialize
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allStories = [];
    let activeCategory = 'সব';

    document.addEventListener("DOMContentLoaded", () => {
      fetchStories();

      // Search Event
      document.getElementById('searchInput').addEventListener('input', filterAndRenderStories);

      // Category Filter Event
      document.querySelectorAll('.cat-btn').forEach(button => {
        button.addEventListener('click', (e) => {
          document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
          e.target.classList.add('active');
          activeCategory = e.target.getAttribute('data-category');
          filterAndRenderStories();
        });
      });
    });

    // Fetch stories from Firestore
    function fetchStories() {
      db.collection("stories").orderBy("createdAt", "desc").get().then((querySnapshot) => {
        allStories = [];
        querySnapshot.forEach((doc) => {
          allStories.push({ id: doc.id, ...doc.data() });
        });
        filterAndRenderStories();
      }).catch(err => {
        console.error(err);
        document.getElementById('storiesGrid').innerHTML = 
          '<p style="text-align:center; grid-column:1/-1; color:var(--text-muted);">গল্প লোড করতে সমস্যা হয়েছে।</p>';
      });
    }

    // Filter & Render logic
    function filterAndRenderStories() {
      const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      const grid = document.getElementById('storiesGrid');
      grid.innerHTML = '';

      const filtered = allStories.filter(story => {
        const matchesCategory = (activeCategory === 'সব') || (story.category === activeCategory);
        const matchesSearch = (story.title && story.title.toLowerCase().includes(searchQuery)) || 
                              (story.content && story.content.toLowerCase().includes(searchQuery));
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:var(--text-muted);">কোনো গল্প পাওয়া যায়নি।</p>';
        return;
      }

      filtered.forEach(story => {
        const card = document.createElement('div');
        card.className = 'story-card';
        card.innerHTML = `
          <div>
            <h3 class="story-title">${escapeHtml(story.title)}</h3>
            <div class="story-excerpt">${escapeHtml(story.content)}</div>
          </div>
          <div class="story-meta">
            <span>ক্যাটাগরি: <strong>${escapeHtml(story.category || 'সাধারণ')}</strong></span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
