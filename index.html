<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অপ্রকাশিত — গল্পের এক অন্য দুনিয়া</title>
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0c10;
      --card-bg: rgba(22, 27, 34, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-color: #58a6ff;
      --accent-glow: rgba(88, 166, 255, 0.25);
      --gradient-accent: linear-gradient(135deg, #a5d6ff 0%, #58a6ff 50%, #1f6beb 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hind Siliguri', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated Background Effect */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background: 
        radial-gradient(circle at 15% 20%, rgba(88, 166, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 70%, rgba(165, 214, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(13, 17, 23, 1) 0%, var(--bg-dark) 100%);
      animation: pulseBg 12s ease-in-out infinite alternate;
    }

    @keyframes pulseBg {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; width: 100%; }

    /* Glassmorphism Navbar */
    .navbar {
      background: rgba(13, 17, 23, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 60px 0 40px;
      animation: fadeInDown 0.8s ease-out;
    }

    .hero h1 {
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(180deg, #ffffff 0%, #c9d1d9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.15rem;
      margin-bottom: 30px;
    }

    /* Modern Glass Search Box */
    .search-box {
      max-width: 520px;
      margin: 0 auto 25px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 14px 22px;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      color: var(--text-main);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .search-box input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    /* Animated Category Chips */
    .categories {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .cat-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 8px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
    }

    .cat-btn:hover {
      border-color: var(--accent-color);
      color: var(--text-main);
      transform: translateY(-2px);
    }

    .cat-btn.active {
      background: var(--accent-color);
      color: #000;
      border-color: var(--accent-color);
      font-weight: 600;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    /* Story Cards Grid */
    .section-title {
      font-size: 1.5rem;
      margin-bottom: 25px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 25px;
      margin-bottom: 60px;
    }

    /* Glassmorphism Animated Card */
    .story-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: fadeInUp 0.6s ease-out forwards;
    }

    .story-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(88, 166, 255, 0.4);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 20px var(--accent-glow);
    }

    .story-title {
      font-size: 1.35rem;
      margin-bottom: 6px;
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.4;
    }

    .story-author {
      font-size: 0.88rem;
      color: var(--accent-color);
      margin-bottom: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .story-excerpt {
      color: var(--text-muted);
      font-size: 0.98rem;
      margin-bottom: 20px;
      white-space: pre-line;
      word-break: break-word;
    }

    .story-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
      padding-top: 14px;
    }

    .category-badge {
      background: rgba(88, 166, 255, 0.1);
      color: var(--accent-color);
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: 500;
      border: 1px solid rgba(88, 166, 255, 0.2);
    }

    /* Keyframe Animations */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      margin-top: auto;
      border-top: 1px solid var(--card-border);
      padding: 30px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      background: rgba(13, 17, 23, 0.8);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

  <!-- Dynamic Gradient Background -->
  <div class="bg-gradient"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">অপ্রকাশিত.</a>
    </div>
  </nav>

  <div class="container">
    <!-- Hero Section -->
    <header class="hero">
      <h1>অপ্রকাশিত অনুভূতির গল্পমালা</h1>
      <p>শব্দে সাজানো হাজারো অপ্রকাশিত অনুভূতি এবং রোমাঞ্চকর গল্পের সমাহার</p>
      
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="গল্পের নাম, লেখক বা কিওয়ার্ড দিয়ে খুঁজুন...">
      </div>

      <div class="categories" id="categoryFilter">
        <button class="cat-btn active" data-category="সব">সব গল্প</button>
        <button class="cat-btn" data-category="রোমান্টিক">রোমান্টিক</button>
        <button class="cat-btn" data-category="থ্রিলার">থ্রিলার</button>
        <button class="cat-btn" data-category="হরর">হরর</button>
        <button class="cat-btn" data-category="জীবনমুখী">জীবনমুখী</button>
        <button class="cat-btn" data-category="অন্যান্য">অন্যান্য</button>
      </div>
    </header>

    <!-- Content Grid -->
    <main>
      <h2 class="section-title">✨ সর্বশেষ গল্পসমূহ</h2>
      <div class="stories-grid" id="storiesGrid">
        <p style="text-align:center; grid-column:1/-1; color:var(--text-muted);">গল্প লোড হচ্ছে...</p>
      </div>
    </main>
  </div>

  <footer>
    <div class="container">
      <p>&copy; 2026 অপ্রকাশিত। সর্বস্বত্ব সংরক্ষিত।</p>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAliz-F-qzpblysGFB4Yephlo4hVPz_7Z0",
      authDomain: "oprokashi-to.firebaseapp.com",
      projectId: "oprokashi-to",
      storageBucket: "oprokashi-to.firebasestorage.app",
      messagingSenderId: "739451365790",
      appId: "1:739451365790:web:1989b3da7ca6a1eab8be8f",
      measurementId: "G-B6JZ36V59E"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allStories = [];
    let activeCategory = 'সব';

    document.addEventListener("DOMContentLoaded", () => {
      fetchStories();
      document.getElementById('searchInput').addEventListener('input', filterAndRenderStories);

      document.querySelectorAll('.cat-btn').forEach(button => {
        button.addEventListener('click', (e) => {
          document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
          e.target.classList.add('active');
          activeCategory = e.target.getAttribute('data-category');
          filterAndRenderStories();
        });
      });
    });

    function fetchStories() {
      db.collection("stories").orderBy("createdAt", "desc").get().then((querySnapshot) => {
        allStories = [];
        querySnapshot.forEach((doc) => {
          allStories.push({ id: doc.id, ...doc.data() });
        });
        filterAndRenderStories();
      });
    }

    function filterAndRenderStories() {
      const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      const grid = document.getElementById('storiesGrid');
      grid.innerHTML = '';

      const filtered = allStories.filter(story => {
        const matchesCategory = (activeCategory === 'সব') || (story.category === activeCategory);
        const matchesSearch = (story.title && story.title.toLowerCase().includes(searchQuery)) || 
                              (story.author && story.author.toLowerCase().includes(searchQuery)) ||
                              (story.content && story.content.toLowerCase().includes(searchQuery));
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:var(--text-muted);">কোনো গল্প পাওয়া যায়নি।</p>';
        return;
      }

      filtered.forEach(story => {
        const card = document.createElement('div');
        card.className = 'story-card';
        card.innerHTML = `
          <div>
            <h3 class="story-title">${escapeHtml(story.title)}</h3>
            <div class="story-author">✍️ ${escapeHtml(story.author || 'অপ্রকাশিত')}</div>
            <div class="story-excerpt">${escapeHtml(story.content)}</div>
          </div>
          <div class="story-meta">
            <span class="category-badge">${escapeHtml(story.category || 'সাধারণ')}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function escapeHtml(text) { return text ? text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
  </script>
</body>
</html>
