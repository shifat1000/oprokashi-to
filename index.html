<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অপ্রকাশিত — গল্পের এক অন্য দুনিয়া</title>
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #030712;
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(56, 189, 248, 0.2);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.4);
      --star-color: #fbbf24;
      --gradient-text: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hind Siliguri', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    #bgCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    .container { max-width: 1050px; margin: 0 auto; padding: 0 20px; width: 100%; }

    .navbar {
      background: rgba(3, 7, 18, 0.8);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 0;
      position: sticky; top: 0; z-index: 100;
    }

    .logo {
      font-size: 1.9rem; font-weight: 700;
      background: var(--gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }

    .hero { text-align: center; padding: 40px 0 20px; }
    .hero h1 {
      font-size: 2.5rem; font-weight: 700; margin-bottom: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 25px; }

    .search-box { max-width: 500px; margin: 0 auto 20px; }
    .search-box input {
      width: 100%; padding: 12px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 25px; color: var(--text-main); font-size: 1rem; outline: none;
      backdrop-filter: blur(12px); transition: all 0.3s ease;
    }
    .search-box input:focus { border-color: var(--accent-color); box-shadow: 0 0 15px var(--accent-glow); }

    .categories { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 35px; }
    .cat-btn {
      background: var(--card-bg); color: var(--text-muted);
      border: 1px solid var(--card-border); padding: 6px 16px; border-radius: 18px;
      cursor: pointer; font-size: 0.9rem; backdrop-filter: blur(8px); transition: all 0.3s ease;
    }
    .cat-btn.active, .cat-btn:hover {
      background: var(--accent-color); color: #000; border-color: var(--accent-color); font-weight: 600;
    }

    .stories-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px; margin-bottom: 50px;
    }

    /* Card List Style */
    .story-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px; padding: 20px;
      cursor: pointer; backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .story-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-color);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-glow);
    }
    .story-title { font-size: 1.25rem; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
    .story-author { font-size: 0.85rem; color: var(--accent-color); margin-bottom: 15px; }

    .story-meta {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 12px; font-size: 0.8rem;
    }
    .category-badge {
      background: rgba(56, 189, 248, 0.12); color: var(--accent-color);
      padding: 3px 10px; border-radius: 10px; border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .read-more-btn { color: var(--accent-color); font-weight: 500; }

    /* Modals */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px);
      z-index: 200; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-content {
      background: rgba(17, 24, 39, 0.95); border: 1px solid var(--card-border);
      padding: 28px; border-radius: 20px; max-width: 600px; width: 100%;
      max-height: 85vh; overflow-y: auto; position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }
    .close-btn {
      position: absolute; top: 16px; right: 20px; font-size: 1.8rem;
      cursor: pointer; color: var(--text-muted); transition: 0.2s;
    }
    .close-btn:hover { color: var(--text-main); }

    .full-story-text {
      color: var(--text-main); font-size: 1.05rem; line-height: 1.8;
      white-space: pre-wrap; margin-top: 20px; word-break: break-word;
    }

    .rating-container {
      display: flex; align-items: center; gap: 6px; margin: 15px 0;
      background: rgba(255, 255, 255, 0.04); padding: 8px 16px; border-radius: 12px;
    }
    .star-btn { cursor: pointer; font-size: 1.3rem; color: #4b5563; }
    .star-btn.active { color: var(--star-color); }
    .rating-score { font-size: 0.85rem; color: var(--text-muted); margin-left: 8px; }

    footer {
      margin-top: auto; border-top: 1px solid var(--card-border);
      padding: 30px 0; background: rgba(3, 7, 18, 0.9);
    }
    .footer-content { display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .footer-buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .footer-btn {
      background: var(--card-bg); color: var(--text-main); border: 1px solid var(--card-border);
      padding: 8px 20px; border-radius: 20px; font-size: 0.9rem; cursor: pointer;
      text-decoration: none; transition: all 0.3s ease;
    }
    .footer-btn:hover { background: var(--accent-color); color: #000; }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">অপ্রকাশিত.</a>
    </div>
  </nav>

  <div class="container">
    <header class="hero">
      <h1>অপ্রকাশিত অনুভূতির গল্পমালা</h1>
      <p>শব্দে সাজানো হাজারো অনুভূতির আত্মপ্রকাশ</p>
      
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="গল্পের নাম বা লেখক দিয়ে খুঁজুন...">
      </div>

      <div class="categories" id="categoryFilter">
        <button class="cat-btn active" data-category="সব">সব গল্প</button>
        <button class="cat-btn" data-category="রোমান্টিক">রোমান্টিক</button>
        <button class="cat-btn" data-category="থ্রিলার">থ্রিলার</button>
        <button class="cat-btn" data-category="হরর">হরর</button>
        <button class="cat-btn" data-category="জীবনমুখী">জীবনমুখী</button>
        <button class="cat-btn" data-category="অন্যান্য">অন্যান্য</button>
      </div>
    </header>

    <main>
      <div class="stories-grid" id="storiesGrid">
        <p style="text-align:center; grid-column:1/-1; color:var(--text-muted);">গল্প লোড হচ্ছে...</p>
      </div>
    </main>
  </div>

  <!-- Story View Modal -->
  <div class="modal" id="storyModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('storyModal')">&times;</span>
      <h2 id="modalTitle" style="color:var(--accent-color); font-size:1.6rem;"></h2>
      <p id="modalAuthor" style="color:var(--text-muted); font-size:0.95rem; margin-top:4px;"></p>
      
      <div class="rating-container">
        <span style="font-size:0.9rem; color:var(--text-muted);">রেটিং দিন:</span>
        <div id="starRating"></div>
        <span class="rating-score" id="modalRatingScore"></span>
      </div>

      <div class="full-story-text" id="modalContent"></div>
    </div>
  </div>

  <!-- About Modal -->
  <div class="modal" id="aboutModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('aboutModal')">&times;</span>
      <h2 style="margin-bottom:15px; color:var(--accent-color);">আমাদের সম্পর্কে</h2>
      <p id="aboutDynamicText" style="color:var(--text-muted); font-size:1rem; line-height:1.7;">
        লোড হচ্ছে...
      </p>
    </div>
  </div>

  <footer>
    <div class="container footer-content">
      <div class="footer-buttons">
        <button class="footer-btn" onclick="openModal('aboutModal')">ℹ️ আমাদের সম্পর্কে</button>
        <a id="contactLink" href="#" target="_blank" class="footer-btn">💬 যোগাযোগ (গল্প পাঠান)</a>
      </div>
      <p class="footer-text">&copy; 2026 অপ্রকাশিত। সর্বস্বত্ব সংরক্ষিত।</p>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    /* Particle Animation */
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();
    for(let i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
        r: Math.random() * 2 + 1, dx: (Math.random() - 0.5) * 0.5, dy: (Math.random() - 0.5) * 0.5,
        alpha: Math.random() * 0.4 + 0.2
      });
    }
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.dx; p.y += p.dy;
        if(p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if(p.y < 0 || p.y > canvas.height) p.dy *= -1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(56, 189, 248, ${p.alpha})`; ctx.fill();
      });
      requestAnimationFrame(animate);
    }
    animate();

    /* Firebase Config */
    const firebaseConfig = {
      apiKey: "AIzaSyAliz-F-qzpblysGFB4Yephlo4hVPz_7Z0",
      authDomain: "oprokashi-to.firebaseapp.com",
      projectId: "oprokashi-to",
      storageBucket: "oprokashi-to.firebasestorage.app",
      messagingSenderId: "739451365790",
      appId: "1:739451365790:web:1989b3da7ca6a1eab8be8f",
      measurementId: "G-B6JZ36V59E"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allStories = [];
    let activeCategory = 'সব';

    document.addEventListener("DOMContentLoaded", () => {
      fetchStories();
      loadSettings();
      document.getElementById('searchInput').addEventListener('input', filterAndRenderStories);

      document.querySelectorAll('.cat-btn').forEach(button => {
        button.addEventListener('click', (e) => {
          document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
          e.target.classList.add('active');
          activeCategory = e.target.getAttribute('data-category');
          filterAndRenderStories();
        });
      });
    });

    function fetchStories() {
      db.collection("stories").orderBy("createdAt", "desc").get().then((querySnapshot) => {
        allStories = [];
        querySnapshot.forEach((doc) => {
          allStories.push({ id: doc.id, ...doc.data() });
        });
        filterAndRenderStories();
      });
    }

    function loadSettings() {
      db.collection("settings").doc("site_info").get().then((doc) => {
        if(doc.exists) {
          const data = doc.data();
          if(data.aboutText) document.getElementById('aboutDynamicText').innerText = data.aboutText;
          if(data.contactUrl) document.getElementById('contactLink').href = data.contactUrl;
        } else {
          document.getElementById('aboutDynamicText').innerText = "'অপ্রকাশিত' হলো সাহিত্যপ্রেমীদের জন্য তৈরি একটি বিশেষ ডিজিটাল প্ল্যাটফর্ম।";
          document.getElementById('contactLink').href = "https://www.facebook.com/share/1EESsM3gDj/";
        }
      });
    }

    function filterAndRenderStories() {
      const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      const grid = document.getElementById('storiesGrid');
      grid.innerHTML = '';

      const filtered = allStories.filter(story => {
        const matchesCategory = (activeCategory === 'সব') || (story.category === activeCategory);
        const matchesSearch = (story.title && story.title.toLowerCase().includes(searchQuery)) || 
                              (story.author && story.author.toLowerCase().includes(searchQuery));
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:var(--text-muted);">কোনো গল্প পাওয়া যায়নি।</p>';
        return;
      }

      filtered.forEach(story => {
        const card = document.createElement('div');
        card.className = 'story-card';
        card.onclick = () => openStoryModal(story.id);
        card.innerHTML = `
          <div>
            <div class="story-title">📖 ${escapeHtml(story.title)}</div>
            <div class="story-author">✍️ ${escapeHtml(story.author || 'অপ্রকাশিত')}</div>
          </div>
          <div class="story-meta">
            <span class="category-badge">${escapeHtml(story.category || 'সাধারণ')}</span>
            <span class="read-more-btn">পড়ুন ➔</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openStoryModal(id) {
      const story = allStories.find(s => s.id === id);
      if(!story) return;

      document.getElementById('modalTitle').innerText = story.title;
      document.getElementById('modalAuthor').innerText = `✍️ ${story.author || 'অপ্রকাশিত'}`;
      document.getElementById('modalContent').innerText = story.content;

      const totalRating = story.totalRating || 0;
      const ratingCount = story.ratingCount || 0;
      const avgRating = ratingCount > 0 ? (totalRating / ratingCount).toFixed(1) : "0.0";

      document.getElementById('modalRatingScore').innerText = `(${avgRating} / ${ratingCount} ভোট)`;

      const starsContainer = document.getElementById('starRating');
      starsContainer.innerHTML = [1,2,3,4,5].map(star => `
        <span class="star-btn ${star <= Math.round(avgRating) ? 'active' : ''}" 
              onclick="rateStory('${story.id}', ${star})">★</span>
      `).join('');

      openModal('storyModal');
    }

    function rateStory(id, star) {
      const storyRef = db.collection("stories").doc(id);
      db.runTransaction((transaction) => {
        return transaction.get(storyRef).then((doc) => {
          if (!doc.exists) return;
          const newTotal = (doc.data().totalRating || 0) + star;
          const newCount = (doc.data().ratingCount || 0) + 1;
          transaction.update(storyRef, { totalRating: newTotal, ratingCount: newCount });
        });
      }).then(() => {
        alert("আপনার রেটিং যুক্ত হয়েছে!");
        fetchStories();
        closeModal('storyModal');
      });
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function escapeHtml(text) { return text ? text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
  </script>
</body>
</html>
