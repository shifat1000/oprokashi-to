<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অপ্রকাশিত — গল্পের এক অন্য দুনিয়া</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-color: #58a6ff;
            --border-color: #30363d;
            --primary-button: #238636;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Navbar */
        .navbar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo span { color: var(--accent-color); }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .nav-links a.active, .nav-links a:hover {
            color: var(--text-main);
        }

        /* Hero Section */
        .hero-section {
            padding: 50px 0 30px;
            text-align: center;
        }

        .hero-title {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* Search Box */
        .search-box {
            max-width: 500px;
            margin: 0 auto 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        /* Category Filter */
        .categories-filter {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        /* Stories Grid */
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .stories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .story-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .story-title {
            font-size: 1.3rem;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .story-excerpt {
            color: var(--text-main);
            font-size: 0.95rem;
            margin-bottom: 15px;
            white-space: pre-line;
        }

        .story-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">অপ্রকাশিত<span>.</span></a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">হোম</a></li>
                <li><a href="admin.html">এডমিন</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container">
            <h1 class="hero-title">অপ্রকাশিত অনুভূতির গল্পমালা</h1>
            <p class="hero-subtitle">শব্দে সাজানো হাজারো অপ্রকাশিত অনুভূতি এবং রোমাঞ্চকর গল্পের সমাহার</p>
            
            <!-- Dynamic Search Box -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="গল্পের নাম বা ক্যাটাগরি দিয়ে খুঁজুন...">
            </div>

            <!-- Category Filter Pills -->
            <div class="categories-filter" id="categoryContainer">
                <button class="cat-btn active" data-category="সব">সব গল্প</button>
                <button class="cat-btn" data-category="রোমান্টিক">রোমান্টিক</button>
                <button class="cat-btn" data-category="থ্রিলার">থ্রিলার</button>
                <button class="cat-btn" data-category="হরর">হরর</button>
                <button class="cat-btn" data-category="জীবনমুখী">জীবনমুখী</button>
                <button class="cat-btn" data-category="অন্যান্য">অন্যান্য</button>
            </div>
        </div>
    </section>

    <!-- Main Content Area -->
    <main class="container">
        
        <!-- All Stories Grid Section -->
        <section>
            <h2 class="section-title" id="storiesTitle">সর্বশেষ গল্পসমূহ</h2>
            <div class="stories-grid" id="storiesGrid">
                <!-- Javascript দিয়ে গল্প এখানে আসবে -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer style="border-top: 1px solid var(--border-color); padding: 2rem 0; margin-top: 4rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
        <div class="container">
            <p>&copy; 2026 অপ্রকাশিত। সর্বস্বত্ব সংরক্ষিত।</p>
        </div>
    </footer>

    <!-- App Logic Script -->
    <script>
        let currentCategory = 'সব';

        document.addEventListener('DOMContentLoaded', () => {
            loadStories();

            // Search Filter
            document.getElementById('searchInput').addEventListener('input', filterStories);

            // Category Filter
            document.querySelectorAll('.cat-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');
                    currentCategory = e.target.getAttribute('data-category');
                    filterStories();
                });
            });
        });

        function loadStories() {
            const stories = JSON.parse(localStorage.getItem('app_stories')) || [];
            renderStories(stories);
        }

        function filterStories() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const stories = JSON.parse(localStorage.getItem('app_stories')) || [];

            const filtered = stories.filter(story => {
                const matchesCat = (currentCategory === 'সব') || (story.category === currentCategory);
                const matchesSearch = story.title.toLowerCase().includes(searchQuery) || story.content.toLowerCase().includes(searchQuery);
                return matchesCat && matchesSearch;
            });

            renderStories(filtered);
        }

        function renderStories(storiesList) {
            const grid = document.getElementById('storiesGrid');
            grid.innerHTML = '';

            if (storiesList.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">কোনো গল্প পাওয়া যায়নি। অ্যাডমিন প্যানেল থেকে গল্প যোগ করুন।</p>`;
                return;
            }

            storiesList.forEach(story => {
                const card = document.createElement('div');
                card.className = 'story-card';
                card.innerHTML = `
                    <div>
                        <h3 class="story-title">${escapeHtml(story.title)}</h3>
                        <div class="story-excerpt">${escapeHtml(story.content)}</div>
                    </div>
                    <div class="story-meta">
                        <span>ক্যাটাগরি: <strong>${story.category || 'সাধারণ'}</strong></span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function escapeHtml(text) {
            return text ? text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }
    </script>

</body>
</html>
