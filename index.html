<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অপ্রকাশিত — Virtual Library</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>
  <!-- Canvas & Lighting Overlays -->
  <canvas id="libraryBackgroundCanvas"></canvas>
  <canvas id="weatherCanvas"></canvas>
  <div id="timeOverlay" class="time-overlay"></div>

  <!-- Header -->
  <header>
    <div class="brand-logo" id="siteNameDisplay" onclick="location.reload()">অপ্রকাশিত.</div>
    <div style="display:flex; gap: 20px; align-items:center;">
      <input type="text" id="searchInput" placeholder="গল্প বা লেখক খুঁজুন..." onkeyup="handleLiveSearch()" style="background:rgba(0,0,0,0.5); border:1px solid var(--glass-border); color:#fff; padding:8px 16px; border-radius:20px; outline:none;">
      <div id="userAuthSection">
        <button class="btn-gold" style="padding: 8px 16px; font-size: 0.85rem;" onclick="location.href='admin.html'">এডমিন প্যানেল</button>
      </div>
    </div>
  </header>

  <!-- Hero Slider -->
  <div class="hero-slider-container" id="heroSlider"></div>

  <!-- Librarian Canvas Avatar Container -->
  <div style="width: 90%; max-width: 1400px; margin: 0 auto; position: relative;">
    <canvas id="librarianCanvas" style="position: absolute; top: -140px; pointer-events: none; z-index: 20;"></canvas>
  </div>

  <!-- Dynamic Bookshelves -->
  <main id="bookshelfShelvesContainer"></main>

  <!-- Floating Controls -->
  <div class="floating-controls">
    <span class="control-icon" title="Ambient Sound Toggle" onclick="toggleAudioEngine()">🎵</span>
    <span class="control-icon" title="Time Override System" onclick="cycleTimeMode()">⌛</span>
    <span class="control-icon" title="Weather Toggle" onclick="toggleWeatherEngine()">🌧️</span>
  </div>

  <!-- Ambient Audio Track -->
  <audio id="ambientAudioLoop" loop src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

  <!-- Scripts -->
  <script src="js/librarian.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(reg => console.log('ServiceWorker registered:', reg)).catch(err => console.log('SW error:', err));
    }
  </script>
</body>
</html>
