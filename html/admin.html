<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel | অপ্রকাশিত</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="admin-container">


<div class="admin-card">


<h1>
অপ্রকাশিত
</h1>

<h2>
Admin Panel
</h2>



<form id="storyForm">



<label>
গল্পের নাম
</label>

<input 
type="text"
id="title"
placeholder="গল্পের শিরোনাম"
required>




<label>
লেখকের নাম
</label>

<input 
type="text"
id="author"
placeholder="লেখকের নাম"
required>




<label>
ক্যাটাগরি
</label>

<select id="category">


<option value="অনুভূতি">
অনুভূতি
</option>


<option value="রহস্য">
রহস্য
</option>


<option value="জীবন">
জীবন
</option>


<option value="প্রেম">
প্রেম
</option>


<option value="কল্পকাহিনী">
কল্পকাহিনী
</option>


</select>




<label>
গল্পের ছবি
</label>

<input 
type="file"
id="coverImage"
accept="image/*">


<img 
id="preview"
alt="Image Preview">





<label>
গল্প লিখুন
</label>

<textarea
id="story"
placeholder="এখানে সম্পূর্ণ গল্প লিখুন..."
required>
</textarea>





<button type="submit">

গল্প প্রকাশ করুন

</button>



</form>



<p id="message"></p>



</div>


</div>





<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="supabase.js"></script>


<script src="admin.js"></script>



</body>

</html>
