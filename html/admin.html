<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এডমিন প্যানেল — অপ্রকাশিত</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">অপ্রকাশিত<span>.</span> <small style="font-size: 0.9rem; color: var(--text-muted); font-weight: normal;">(Admin Panel)</small></a>
            <ul class="nav-links">
                <li><a href="index.html" target="_blank">লাইভ সাইট</a></li>
                <li><button id="logoutBtn" class="btn btn-danger" style="padding: 0.4rem 1rem; font-size: 0.85rem;">লগআউট</button></li>
            </ul>
        </div>
    </nav>

    <!-- Admin Main Container -->
    <main class="container" style="margin-top: 2rem;">
        
        <!-- Story Create / Edit Form Card -->
        <div class="admin-card">
            <h2 id="formTitle" style="margin-bottom: 1.5rem;">নতুন গল্প প্রকাশ করুন</h2>
            
            <form id="storyForm">
                <input type="hidden" id="storyId">

                <div class="form-group">
                    <label for="storyTitle">গল্পের শিরোনাম</label>
                    <input type="text" id="storyTitle" class="form-control" placeholder="গল্পের আকর্ষণীয় নাম লিখুন" required>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                    <div class="form-group">
                        <label for="storyAuthor">লেখকের নাম</label>
                        <input type="text" id="storyAuthor" class="form-control" placeholder="যেমন: শাফায়াত জামান" required>
                    </div>

                    <div class="form-group">
                        <label for="storyCategory">ক্যাটাগরি</label>
                        <select id="storyCategory" class="form-control" required>
                            <option value="রোমান্টিক">রোমান্টিক</option>
                            <option value="থ্রিলার">থ্রিলার</option>
                            <option value="হরর">হরর</option>
                            <option value="জীবনমুখী">জীবনমুখী</option>
                            <option value="অন্যান্য" selected>অন্যান্য</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="storyCover">কভার ইমেজ আপলোড (Supabase Storage)</label>
                    <input type="file" id="storyCover" class="form-control" accept="image/*">
                    <small style="color: var(--text-muted); display: block; margin-top: 0.25rem;">নতুন ইমেজ সিলেক্ট না করলে আগেরটিই থাকবে।</small>
                </div>

                <div class="form-group">
                    <label for="storyContent">গল্পের মূল লেখা</label>
                    <textarea id="storyContent" class="form-control" rows="10" placeholder="এখানে গল্প লিখুন..." required></textarea>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button type="submit" id="submitBtn" class="btn btn-primary">গল্প পাবলিশ করুন</button>
                    <button type="button" id="cancelEditBtn" class="btn" style="display: none; background: #475569; color: white;">সম্পাদনা বাতিল</button>
                </div>
            </form>
        </div>

        <!-- Managed Published Stories List Card -->
        <div class="admin-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                <h2>প্রকাশিত গল্পসমূহ</h2>
                <input type="text" id="adminSearchInput" class="form-control" placeholder="গল্প খুঁজুন..." style="max-width: 300px;">
            </div>

            <div id="adminStoriesList" style="display: flex; flex-direction: column; gap: 1rem;">
                <p style="color: var(--text-muted); text-align: center;">তালিকা লোড করা হচ্ছে...</p>
            </div>
        </div>

    </main>

    <!-- Supabase CDN Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Admin Panel Script Logic -->
    <script type="module" src="js/admin.js"></script>

</body>
</html>
