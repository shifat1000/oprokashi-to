<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অপ্রকাশিত — গল্পের এক অন্য দুনিয়া</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">অপ্রকাশিত<span>.</span></a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">হোম</a></li>
                <li><a href="admin.html">এডমিন</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container">
            <h1 class="hero-title">অপ্রকাশিত অনুভূতির গল্পমালা</h1>
            <p class="hero-subtitle">শব্দে সাজানো হাজারো অপ্রকাশিত অনুভূতি এবং রোমাঞ্চকর গল্পের সমাহার</p>
            
            <!-- Dynamic Search Box -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="গল্পের নাম বা লেখকের নাম দিয়ে খুঁজুন...">
            </div>

            <!-- Category Filter Pills -->
            <div class="categories-filter" id="categoryContainer">
                <button class="cat-btn active" data-category="সব">সব গল্প</button>
                <button class="cat-btn" data-category="রোমান্টিক">রোমান্টিক</button>
                <button class="cat-btn" data-category="থ্রিলার">থ্রিলার</button>
                <button class="cat-btn" data-category="হরর">হরর</button>
                <button class="cat-btn" data-category="জীবনমুখী">জীবনমুখী</button>
                <button class="cat-btn" data-category="অন্যান্য">অন্যান্য</button>
            </div>
        </div>
    </section>

    <!-- Main Content Area -->
    <main class="container">
        
        <!-- Featured / Trending Stories Section -->
        <section id="trendingSection" style="margin-bottom: 3rem; display: none;">
            <h2 class="section-title">ট্রেন্ডিং গল্পসমূহ</h2>
            <div class="stories-grid" id="trendingGrid">
                <!-- JS দিয়ে ট্রেন্ডিং গল্পসমূহ এখানে লোড হবে -->
            </div>
        </section>

        <!-- All Stories Grid Section -->
        <section>
            <h2 class="section-title" id="storiesTitle">সর্বশেষ গল্পসমূহ</h2>
            <div class="stories-grid" id="storiesGrid">
                <!-- Loading Skeleton / Message -->
                <p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">গল্প লোড করা হচ্ছে...</p>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer style="border-top: 1px solid var(--border-color); padding: 2rem 0; margin-top: 4rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
        <div class="container">
            <p>&copy; 2026 অপ্রকাশিত। সর্বস্বত্ব সংরক্ষিত।</p>
        </div>
    </footer>

    <!-- Supabase CDN Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- App Logic Script -->
    <script type="module" src="js/app.js"></script>

</body>
</html>
