<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অপ্রকাশিত — অ্যাডমিন প্যানেল</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="admin/css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-wrapper">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-brand">অপ্রকাশিত CMS</div>
      <ul class="admin-nav">
        <li class="admin-nav-item active">নতুন গল্প যুক্ত করুন</li>
        <li class="admin-nav-item" onclick="window.location.href='index.html'">লাইব্রেরি ভিউ</li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="admin-content">
      <!-- Login View -->
      <section id="loginSection" class="admin-card" style="max-width: 400px; margin: 100px auto; display: none;">
        <h2 style="color: var(--color-primary); margin-bottom: 20px;">অ্যাডমিন লগইন</h2>
        <div class="admin-form-group">
          <label class="admin-label">ইমেইল</label>
          <input type="email" id="adminEmail" class="admin-input" placeholder="admin@oprokashi.com">
        </div>
        <div class="admin-form-group">
          <label class="admin-label">পাসওয়ার্ড</label>
          <input type="password" id="adminPassword" class="admin-input" placeholder="••••••••">
        </div>
        <button class="admin-btn" style="width: 100%;" onclick="AdminController.login(document.getElementById('adminEmail').value, document.getElementById('adminPassword').value)">লগইন করুন</button>
      </section>

      <!-- Publishing Dashboard View -->
      <section id="dashboardSection" class="admin-card" style="display: none;">
        <h2 style="color: var(--color-primary); margin-bottom: 20px;">নতুন গল্প প্রকাশ করুন</h2>
        <form id="publishStoryForm">
          <div class="admin-form-group">
            <label class="admin-label">গল্পের শিরোনাম</label>
            <input type="text" id="storyTitleInput" class="admin-input" placeholder="গল্পের নাম লিখুন..." required>
          </div>

          <div style="display: flex; gap: 20px;">
            <div class="admin-form-group" style="flex: 1;">
              <label class="admin-label">লেখকের নাম</label>
              <input type="text" id="storyAuthorInput" class="admin-input" placeholder="লেখকের নাম...">
            </div>
            <div class="admin-form-group" style="flex: 1;">
              <label class="admin-label">ক্যাটাগরি / সেলফ</label>
              <select id="storyCategorySelect" class="admin-select">
                <option value="জনপ্রিয়">জনপ্রিয়</option>
                <option value="রহস্য ও থ্রিলার">রহস্য ও থ্রিলার</option>
                <option value="রোমান্স">রোমান্স</option>
                <option value="ইসলামিক">ইসলামিক</option>
                <option value="সাই-ফাই">সাই-ফাই</option>
              </select>
            </div>
          </div>

          <div class="admin-form-group">
            <label class="admin-label">বুক কভার ইমেজ (Upload Image)</label>
            <input type="file" id="storyCoverFileInput" class="admin-input" accept="image/*">
          </div>

          <div class="admin-form-group">
            <label class="admin-label">গল্পের বিষয়বস্তু / অধ্যায়</label>
            <textarea id="storyContentInput" class="admin-textarea" rows="12" placeholder="সম্পূর্ণ গল্প বা প্রথম অধ্যায় এখানে লিখুন..." required></textarea>
          </div>

          <button type="submit" class="admin-btn">গল্প প্রকাশ করুন</button>
        </form>
      </section>
    </main>
  </div>

  <!-- Firebase Compatibility SDK (v10.8.0) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <!-- Oprokashi Scripts -->
  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="admin/js/admin.js"></script>
</body>
</html>
