<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এডমিন কন্ট্রোল — অপ্রকাশিত</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(18, 24, 38, 0.85);
      --card-border: rgba(88, 166, 255, 0.15);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-color: #58a6ff;
      --danger-color: #f85149;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hind Siliguri', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container { max-width: 800px; margin: 0 auto; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h2 { color: var(--accent-color); margin-bottom: 20px; }
    .form-group { margin-bottom: 18px; }

    label { display: block; margin-bottom: 6px; color: var(--text-main); }
    input, select, textarea {
      width: 100%; padding: 12px; background: rgba(0,0,0,0.4);
      border: 1px solid var(--card-border); border-radius: 8px;
      color: var(--text-main); font-family: inherit; outline: none;
    }

    button {
      padding: 12px 24px; background: var(--accent-color);
      color: #000; font-weight: 700; border: none; border-radius: 8px;
      cursor: pointer; font-family: inherit; margin-right: 10px;
    }

    .btn-cancel { background: rgba(255,255,255,0.1); color: var(--text-main); display: none; }

    .story-item {
      background: rgba(0,0,0,0.3); border: 1px solid var(--card-border);
      padding: 16px; border-radius: 10px; margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .btn-edit { background: rgba(88, 166, 255, 0.2); color: var(--accent-color); padding: 6px 12px; font-size: 0.85rem;}
    .btn-delete { background: rgba(248, 81, 73, 0.2); color: var(--danger-color); padding: 6px 12px; font-size: 0.85rem;}
  </style>
</head>
<body>

  <div class="container">
    <div class="card" id="loginBox">
      <h2>🔐 এডমিন লগইন</h2>
      <div class="form-group">
        <label>পাসওয়ার্ড:</label>
        <input type="password" id="adminPin">
      </div>
      <button onclick="checkAccess()">প্রবেশ করুন</button>
    </div>

    <div class="card" id="adminBox" style="display:none;">
      <h2 id="formTitle">✍️ পোস্ট বা এডিট করুন</h2>
      <form id="storyForm">
        <input type="hidden" id="editStoryId">
        <div class="form-group">
          <label>শিরোনাম:</label>
          <input type="text" id="title" required>
        </div>
        <div class="form-group">
          <label>লেখক:</label>
          <input type="text" id="author" required>
        </div>
        <div class="form-group">
          <label>ক্যাটাগরি:</label>
          <select id="category">
            <option value="রোমান্টিক">রোমান্টিক</option>
            <option value="থ্রিলার">থ্রিলার</option>
            <option value="হরর">হরর</option>
            <option value="জীবনমুখী">জীবনমুখী</option>
            <option value="অন্যান্য">অন্যান্য</option>
          </select>
        </div>
        <div class="form-group">
          <label>মূল গল্প:</label>
          <textarea id="content" rows="6" required></textarea>
        </div>
        <button type="submit" id="submitBtn">পাবলিশ করুন</button>
        <button type="button" class="btn-cancel" id="cancelBtn" onclick="resetForm()">বাতিল</button>
      </form>

      <h2 style="margin-top:35px;">📚 সকল পোস্ট এডমিন কন্ট্রোল</h2>
      <div id="adminStoriesList"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const SECRET_PIN = "123456"; 

    function checkAccess() {
      if (document.getElementById('adminPin').value === SECRET_PIN) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminBox').style.display = 'block';
        loadAdminStories();
      } else { alert("ভুল পাসওয়ার্ড!"); }
    }

    const firebaseConfig = {
      apiKey: "AIzaSyAliz-F-qzpblysGFB4Yephlo4hVPz_7Z0",
      authDomain: "oprokashi-to.firebaseapp.com",
      projectId: "oprokashi-to",
      storageBucket: "oprokashi-to.firebasestorage.app",
      messagingSenderId: "739451365790",
      appId: "1:739451365790:web:1989b3da7ca6a1eab8be8f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById('storyForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const editId = document.getElementById('editStoryId').value;
      const data = {
        title: document.getElementById('title').value.trim(),
        author: document.getElementById('author').value.trim(),
        category: document.getElementById('category').value,
        content: document.getElementById('content').value.trim(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      if (editId) {
        db.collection("stories").doc(editId).update(data).then(() => {
          alert("তথ্য সফলভাবে এডিট হয়েছে!");
          resetForm(); loadAdminStories();
        });
      } else {
        data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        db.collection("stories").add(data).then(() => {
          alert("নতুন গল্প পাবলিশ করা হয়েছে!");
          resetForm(); loadAdminStories();
        });
      }
    });

    function loadAdminStories() {
      const list = document.getElementById('adminStoriesList');
      db.collection("stories").orderBy("createdAt", "desc").get().then((snapshot) => {
        list.innerHTML = '';
        snapshot.forEach(doc => {
          const item = doc.data();
          const div = document.createElement('div');
          div.className = 'story-item';
          div.innerHTML = `
            <div>
              <h4>${escapeHtml(item.title)}</h4>
              <p style="font-size:0.85rem; color:var(--text-muted)">লেখক: ${escapeHtml(item.author)} | ক্যাটাগরি: ${escapeHtml(item.category)}</p>
            </div>
            <div>
              <button class="btn-edit" onclick="editStory('${doc.id}', '${escapeQuote(item.title)}', '${escapeQuote(item.author)}', '${item.category}', '${escapeQuote(item.content)}')">এডিট</button>
              <button class="btn-delete" onclick="deleteStory('${doc.id}')">ডিলিট</button>
            </div>
          `;
          list.appendChild(div);
        });
      });
    }

    function editStory(id, title, author, category, content) {
      document.getElementById('editStoryId').value = id;
      document.getElementById('title').value = title;
      document.getElementById('author').value = author;
      document.getElementById('category').value = category;
      document.getElementById('content').value = content;
      
      document.getElementById('formTitle').innerText = "✏️ গল্প আপডেট করুন";
      document.getElementById('submitBtn').innerText = "আপডেট";
      document.getElementById('cancelBtn').style.display = "inline-block";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteStory(id) {
      if (confirm("আপনি কি নিশ্চিত এটি মুছে ফেলতে চান?")) {
        db.collection("stories").doc(id).delete().then(() => {
          alert("সফলভাবে ডিলিট করা হয়েছে!");
          loadAdminStories();
        });
      }
    }

    function resetForm() {
      document.getElementById('storyForm').reset();
      document.getElementById('editStoryId').value = '';
      document.getElementById('formTitle').innerText = "✍️ পোস্ট বা এডিট করুন";
      document.getElementById('submitBtn').innerText = "পাবলিশ করুন";
      document.getElementById('cancelBtn').style.display = "none";
    }

    function escapeHtml(text) { return text ? text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
    function escapeQuote(text) { return text ? text.replace(/'/g, "\\'").replace(/\n/g, "\\n") : ''; }
  </script>
</body>
</html>
