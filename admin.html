<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel | অপ্রকাশিত</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="admin-container">


<div class="admin-card">


<h1>
অপ্রকাশিত
</h1>

<h2>
Admin Panel
</h2>



<form>



<label>
গল্পের নাম
</label>

<input 
type="text" 
id="title"
placeholder="গল্পের শিরোনাম">





<label>
লেখকের নাম
</label>

<input 
type="text"
id="author"
placeholder="লেখকের নাম">





<label>
ক্যাটাগরি
</label>


<select id="category">

<option>অনুভূতি</option>

<option>রহস্য</option>

<option>জীবন</option>

<option>প্রেম</option>

<option>কল্পকাহিনী</option>


</select>






<label>
গল্পের ছবি
</label>


<input 
type="file"
id="coverImage"
accept="image/*">



<img 
id="preview"
src=""
alt="Preview">





<label>
গল্প লিখুন
</label>


<textarea 
id="story"
placeholder="এখানে গল্প লিখুন...">
</textarea>





<button type="button">

গল্প প্রকাশ করুন

</button>



</form>


</div>


</div>





<script>


const imageInput =
document.getElementById("coverImage");


const preview =
document.getElementById("preview");



imageInput.addEventListener(
"change",
function(){


const file=this.files[0];


if(file){

preview.src=
URL.createObjectURL(file);


preview.style.display="block";


}


});


</script>



</body>

</html>
