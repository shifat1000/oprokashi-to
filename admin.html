<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এডমিন কন্ট্রোল প্যানেল — অপ্রকাশিত</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-color: #58a6ff;
      --border-color: #30363d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hind Siliguri', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 40px 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    
    /* Login Box */
    .login-box, .admin-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px;
    }
    .admin-box { display: none; }
    
    h2 { margin-bottom: 20px; text-align: center; color: var(--accent-color); }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: 500; }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 1rem;
      font-family: inherit;
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--accent-color);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.05rem;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

<div class="container">
  <!-- Login Form -->
  <div class="login-box" id="loginBox">
    <h2>এডমিন লগইন</h2>
    <div class="form-group">
      <label>সিক্রেট পিন / পাসওয়ার্ড:</label>
      <input type="password" id="adminPin" placeholder="পাসওয়ার্ড লিখুন">
    </div>
    <button onclick="checkAccess()">প্রবেশ করুন</button>
  </div>

  <!-- Main Admin Form -->
  <div class="admin-box" id="adminBox">
    <h2>নতুন গল্প পোস্ট করুন</h2>
    <form id="storyForm">
      <div class="form-group">
        <label>গল্পের শিরোনাম:</label>
        <input type="text" id="title" placeholder="শিরোনাম দিন..." required>
      </div>
      <div class="form-group">
        <label>ক্যাটাগরি:</label>
        <select id="category">
          <option value="রোমান্টিক">রোমান্টিক</option>
          <option value="থ্রিলার">থ্রিলার</option>
          <option value="হরর">হরর</option>
          <option value="জীবনমুখী">জীবনমুখী</option>
          <option value="অন্যান্য">অন্যান্য</option>
        </select>
      </div>
      <div class="form-group">
        <label>গল্পের বিবরণ:</label>
        <textarea id="content" rows="8" placeholder="গল্পের মূল অংশ লিখুন..." required></textarea>
      </div>
      <button type="submit">পাবলিশ করুন</button>
    </form>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
  // সিক্রেট পাসওয়ার্ড (আপনি নিজের মতো পরিবর্তন করে নিতে পারেন)
  const SECRET_PIN = "123456"; 

  function checkAccess() {
    const pinInput = document.getElementById('adminPin').value;
    if (pinInput === SECRET_PIN) {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('adminBox').style.display = 'block';
    } else {
      alert("ভুল পাসওয়ার্ড!");
    }
  }

  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyAliz-F-qzpblysGFB4Yephlo4hVPz_7Z0",
    authDomain: "oprokashi-to.firebaseapp.com",
    projectId: "oprokashi-to",
    storageBucket: "oprokashi-to.firebasestorage.app",
    messagingSenderId: "739451365790",
    appId: "1:739451365790:web:1989b3da7ca6a1eab8be8f",
    measurementId: "G-B6JZ36V59E"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  document.getElementById('storyForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const title = document.getElementById('title').value.trim();
    const category = document.getElementById('category').value;
    const content = document.getElementById('content').value.trim();

    db.collection("stories").add({
      title: title,
      category: category,
      content: content,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    })
    .then(() => {
      alert("গল্প সফলভাবে পাবলিশ হয়েছে!");
      document.getElementById('storyForm').reset();
    })
    .catch((err) => {
      alert("এরর: " + err.message);
    });
  });
</script>

</body>
</html>
