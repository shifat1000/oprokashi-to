<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এডমিন কন্ট্রোল — অপ্রকাশিত</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #030712;
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(56, 189, 248, 0.2);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --accent-color: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hind Siliguri', sans-serif;
      background-color: var(--bg-dark); color: var(--text-main);
      padding: 30px 15px; display: flex; justify-content: center;
    }
    .admin-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 25px; max-width: 650px; width: 100%;
      margin-bottom: 20px;
    }
    h2 { color: var(--accent-color); margin-bottom: 20px; font-size: 1.4rem; }
    label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text-muted); }
    input, select, textarea {
      width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.4);
      border: 1px solid var(--card-border); border-radius: 8px;
      color: #fff; margin-bottom: 15px; outline: none; font-family: inherit;
    }
    button {
      background: var(--accent-color); color: #000; border: none;
      padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    .list-item {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0,0,0,0.3); padding: 10px 15px; border-radius: 8px;
      margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05);
    }
    .btn-danger { background: #ef4444; color: #fff; padding: 5px 10px; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div style="width: 100%; max-width: 650px;">
    
    <!-- 1. Post Story -->
    <div class="admin-card">
      <h2>✍️ গল্প পোস্ট / এডিট করুন</h2>
      <input type="hidden" id="editStoryId">
      <label>শিরোনাম:</label>
      <input type="text" id="titleInput" placeholder="গল্পের শিরোনাম">
      <label>লেখক:</label>
      <input type="text" id="authorInput" placeholder="লেখকের নাম">
      <label>ক্যাটাগরি:</label>
      <select id="categorySelect">
        <option value="রোমান্টিক">রোমান্টিক</option>
        <option value="থ্রিলার">থ্রিলার</option>
        <option value="হরর">হরর</option>
        <option value="জীবনমুখী">জীবনমুখী</option>
        <option value="অন্যান্য">অন্যান্য</option>
      </select>
      <label>মূল গল্প:</label>
      <textarea id="contentInput" rows="6" placeholder="সম্পূর্ণ গল্প লিখুন..."></textarea>
      <button onclick="saveStory()">পাবলিশ করুন</button>
    </div>

    <!-- 2. Manage Info / Contact -->
    <div class="admin-card">
      <h2>⚙️ আমাদের সম্পর্কে ও কন্টাক্ট লিঙ্ক সেটিং</h2>
      <label>আমাদের সম্পর্কে (About Text):</label>
      <textarea id="aboutTextInput" rows="3" placeholder="আমাদের সম্পর্কে তথ্য লিখুন..."></textarea>
      <label>যোগাযোগ / গল্প পাঠানোর ফেসবুক লিংক:</label>
      <input type="url" id="contactUrlInput" placeholder="https://facebook.com/...">
      <button onclick="saveSettings()">সেটিং সেভ করুন</button>
    </div>

    <!-- 3. Stories List -->
    <div class="admin-card">
      <h2>📚 প্রকাশিত গল্প ম্যানেজমেন্ট</h2>
      <div id="adminStoriesList">লোড হচ্ছে...</div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAliz-F-qzpblysGFB4Yephlo4hVPz_7Z0",
      authDomain: "oprokashi-to.firebaseapp.com",
      projectId: "oprokashi-to",
      storageBucket: "oprokashi-to.firebasestorage.app",
      messagingSenderId: "739451365790",
      appId: "1:739451365790:web:1989b3da7ca6a1eab8be8f",
      measurementId: "G-B6JZ36V59E"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.addEventListener("DOMContentLoaded", () => {
      loadAdminStories();
      loadSettings();
    });

    function saveStory() {
      const id = document.getElementById('editStoryId').value;
      const title = document.getElementById('titleInput').value;
      const author = document.getElementById('authorInput').value;
      const category = document.getElementById('categorySelect').value;
      const content = document.getElementById('contentInput').value;

      if(!title || !content) return alert("শিরোনাম ও মূল গল্প আবশ্যক!");

      const storyData = {
        title, author, category, content,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      if(id) {
        db.collection("stories").doc(id).update(storyData).then(() => {
          alert("গল্প আপডেট হয়েছে!");
          resetForm();
          loadAdminStories();
        });
      } else {
        db.collection("stories").add(storyData).then(() => {
          alert("নতুন গল্প পাবলিশ হয়েছে!");
          resetForm();
          loadAdminStories();
        });
      }
    }

    function loadAdminStories() {
      db.collection("stories").orderBy("createdAt", "desc").get().then((querySnapshot) => {
        const list = document.getElementById('adminStoriesList');
        list.innerHTML = '';
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const div = document.createElement('div');
          div.className = 'list-item';
          div.innerHTML = `
            <div>
              <strong>${data.title}</strong> <small>(${data.author})</small>
            </div>
            <div>
              <button onclick="editStory('${doc.id}', '${escapeQuotes(data.title)}', '${escapeQuotes(data.author)}', '${data.category}', '${escapeQuotes(data.content)}')">এডিট</button>
              <button class="btn-danger" onclick="deleteStory('${doc.id}')">ডিলিট</button>
            </div>
          `;
          list.appendChild(div);
        });
      });
    }

    function editStory(id, title, author, category, content) {
      document.getElementById('editStoryId').value = id;
      document.getElementById('titleInput').value = title;
      document.getElementById('authorInput').value = author;
      document.getElementById('categorySelect').value = category;
      document.getElementById('contentInput').value = content;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteStory(id) {
      if(confirm("সত্যিই ডিলিট করতে চান?")) {
        db.collection("stories").doc(id).delete().then(() => {
          alert("ডিলিট হয়েছে!");
          loadAdminStories();
        });
      }
    }

    function saveSettings() {
      const aboutText = document.getElementById('aboutTextInput').value;
      const contactUrl = document.getElementById('contactUrlInput').value;

      db.collection("settings").doc("site_info").set({
        aboutText, contactUrl
      }).then(() => {
        alert("সেটিং সেভ হয়েছে!");
      });
    }

    function loadSettings() {
      db.collection("settings").doc("site_info").get().then((doc) => {
        if(doc.exists) {
          const data = doc.data();
          document.getElementById('aboutTextInput').value = data.aboutText || '';
          document.getElementById('contactUrlInput').value = data.contactUrl || '';
        }
      });
    }

    function resetForm() {
      document.getElementById('editStoryId').value = '';
      document.getElementById('titleInput').value = '';
      document.getElementById('authorInput').value = '';
      document.getElementById('contentInput').value = '';
    }

    function escapeQuotes(str) {
      return str ? str.replace(/'/g, "\\'").replace(/\n/g, "\\n") : '';
    }
  </script>
</body>
</html>
