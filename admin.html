<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Virtual Library Admin Controller</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body style="padding: 40px 15px; background: #030712;">

  <div style="max-width: 1000px; margin: 0 auto; background: var(--glass-bg); padding: 30px; border-radius: 16px; border: 1px solid var(--glass-border);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px;">
      <h1 style="color: var(--gold-accent); font-family: 'Cinzel', serif;">🛠️ Master Virtual Library Administration</h1>
      <button class="btn-gold" onclick="location.href='index.html'">হোমপেজে ফেরত</button>
    </div>

    <!-- 1. Ambient & Atmospheric Control -->
    <div style="margin-bottom: 30px; background: rgba(0,0,0,0.4); padding: 20px; border-radius: 10px;">
      <h3 style="color:#fff; margin-bottom:15px;">🌐 Ambient & Atmosphere Control</h3>
      <label style="color:#aaa; display:block; margin-bottom: 6px;">Library Default Time Override:</label>
      <select id="adminTimeSelect" style="width:100%; padding:10px; margin-bottom:15px; background:#1e293b; color:#fff; border:none; border-radius:6px; outline:none;">
        <option value="AUTO">Automatic (Real Local Time)</option>
        <option value="morning">Morning (Sunlight)</option>
        <option value="afternoon">Afternoon (Bright)</option>
        <option value="evening">Evening (Golden Hour)</option>
        <option value="night">Night (Moonlight & Warm Lamps)</option>
      </select>
      <button class="btn-gold" onclick="saveAtmosphereSettings()">Save Atmosphere Settings</button>
    </div>

    <!-- 2. Story Publisher & Shelf Asset Manager -->
    <div style="margin-bottom: 30px; background: rgba(0,0,0,0.4); padding: 20px; border-radius: 10px;">
      <h3 style="color:#fff; margin-bottom:15px;">📖 Publisher & 3D Bookshelf Asset Manager</h3>
      <input type="hidden" id="adminStoryId">
      <label style="color:#aaa; display:block; margin-bottom: 4px;">শিরোনাম:</label>
      <input type="text" id="adminTitle" placeholder="বইয়ের শিরোনাম" style="width:100%; padding:10px; margin-bottom:12px; background:#1e293b; color:#fff; border:none; border-radius:6px; outline:none;">
      
      <label style="color:#aaa; display:block; margin-bottom: 4px;">লেখক:</label>
      <input type="text" id="adminAuthor" placeholder="লেখকের নাম" style="width:100%; padding:10px; margin-bottom:12px; background:#1e293b; color:#fff; border:none; border-radius:6px; outline:none;">
      
      <label style="color:#aaa; display:block; margin-bottom: 4px;">ক্যাটাগরি / বুকশেলফ:</label>
      <select id="adminCategory" style="width:100%; padding:10px; margin-bottom:12px; background:#1e293b; color:#fff; border:none; border-radius:6px; outline:none;">
        <option value="Trending">Trending Shelf</option>
        <option value="Romance">Romance Shelf</option>
        <option value="Horror">Horror Shelf</option>
        <option value="Mystery">Mystery Shelf</option>
        <option value="Islamic">Islamic Shelf</option>
        <option value="Sci-Fi">Sci-Fi Shelf</option>
      </select>

      <label style="color:#aaa; display:block; margin-bottom: 4px;">কভার ফটো (Direct Upload):</label>
      <input type="file" id="adminCoverFile" accept="image/*" style="margin-bottom:15px; color:#fff; display:block;">

      <label style="color:#aaa; display:block; margin-bottom: 4px;">সম্পূর্ণ কন্টেন্ট:</label>
      <textarea id="adminContent" rows="6" placeholder="গল্প বা উপন্যাস লিখুন..." style="width:100%; padding:10px; background:#1e293b; color:#fff; border:none; border-radius:6px; margin-bottom:15px; outline:none;"></textarea>
      
      <button class="btn-gold" id="saveStoryBtn" onclick="saveAdminStory()">পাবলিশ / আপডেট করুন</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAliz-F-qzpblysGFB4Yephlo4hVPz_7Z0",
      authDomain: "oprokashi-to.firebaseapp.com",
      projectId: "oprokashi-to",
      storageBucket: "oprokashi-to.firebasestorage.app",
      messagingSenderId: "739451365790",
      appId: "1:739451365790:web:1989b3da7ca6a1eab8be8f",
      measurementId: "G-B6JZ36V59E"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    async function saveAtmosphereSettings() {
      const mode = document.getElementById('adminTimeSelect').value;
      try {
        await db.collection("settings").doc("site_info").set({ defaultTimeMode: mode }, { merge: true });
        alert("Atmosphere saved!");
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    async function saveAdminStory() {
      const id = document.getElementById('adminStoryId').value;
      const title = document.getElementById('adminTitle').value;
      const author = document.getElementById('adminAuthor').value;
      const category = document.getElementById('adminCategory').value;
      const content = document.getElementById('adminContent').value;
      const file = document.getElementById('adminCoverFile').files[0];
      const btn = document.getElementById('saveStoryBtn');

      if (!title || !content) return alert("শিরোনাম এবং কন্টেন্ট আবশ্যক!");

      btn.disabled = true;
      btn.innerText = "প্রসেস হচ্ছে...";

      try {
        let coverUrl = '';
        if (file) {
          const ref = storage.ref(`covers/${Date.now()}_${file.name}`);
          await ref.put(file);
          coverUrl = await ref.getDownloadURL();
        }

        const data = {
          title,
          author,
          category,
          content,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        if (coverUrl) data.coverUrl = coverUrl;

        if (id) {
          await db.collection("stories").doc(id).update(data);
        } else {
          data.views = 0;
          await db.collection("stories").add(data);
        }
        alert("সফলভাবে সেভ হয়েছে!");
        location.reload();
      } catch (err) {
        alert("ত্রুটি: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "পাবলিশ / আপডেট করুন";
      }
    }
  </script>
</body>
</html>
