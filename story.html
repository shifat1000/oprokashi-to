<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পড়ছেন — Virtual Reader Engine</title>
  <link rel="stylesheet" href="css/style.css">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    body {
      background: #0c0a09;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 15px;
    }
    .book-viewport {
      width: 100%;
      max-width: 900px;
      min-height: 650px;
      background: #fdf6e3;
      color: #262626;
      border-radius: 8px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.9), inset 30px 0 50px rgba(0,0,0,0.08);
      padding: 60px 80px;
      position: relative;
      transition: background 0.4s, color 0.4s;
      margin-top: 50px;
    }
    .reader-dark { background: #121212 !important; color: #e0e0e0 !important; }
    .reader-sepia { background: #f4ecd8 !important; color: #5b4636 !important; }
    .page-content {
      font-family: 'Merriweather', 'Hind Siliguri', serif;
      font-size: 1.2rem;
      line-height: 2.1;
      text-align: justify;
      white-space: pre-wrap;
    }
    .reader-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      padding-bottom: 10px;
    }
    .reader-toolbar {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      background: rgba(0,0,0,0.8);
      padding: 10px;
      border-radius: 20px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div class="reader-toolbar">
    <button class="btn-gold" style="padding: 6px 12px; font-size: 0.8rem;" onclick="setReaderTheme('light')">☀️ Light</button>
    <button class="btn-gold" style="padding: 6px 12px; font-size: 0.8rem;" onclick="setReaderTheme('sepia')">📜 Sepia</button>
    <button class="btn-gold" style="padding: 6px 12px; font-size: 0.8rem;" onclick="setReaderTheme('dark')">🌙 Dark</button>
    <button class="btn-gold" style="padding: 6px 12px; font-size: 0.8rem;" onclick="location.href='index.html'">🚪 লাইব্রেরিতে ফেরত</button>
  </div>

  <div class="book-viewport" id="bookViewport">
    <div class="reader-header">
      <h2 id="storyTitleDisplay" style="font-family: 'Cinzel', serif;">গল্প লোড হচ্ছে...</h2>
      <span id="readingProgressDisplay" style="font-size: 0.85rem;">প্রগ্রেস: 0%</span>
    </div>
    <div class="page-content" id="storyContentDisplay">
      অপেক্ষা করুন, ভার্চুয়াল লাইব্রেরি বুক পেজ ফরম্যাট করা হচ্ছে...
    </div>
  </div>

  <script src="js/pageflip.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAliz-F-qzpblysGFB4Yephlo4hVPz_7Z0",
      authDomain: "oprokashi-to.firebaseapp.com",
      projectId: "oprokashi-to",
      storageBucket: "oprokashi-to.firebasestorage.app",
      messagingSenderId: "739451365790",
      appId: "1:739451365790:web:1989b3da7ca6a1eab8be8f",
      measurementId: "G-B6JZ36V59E"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const storyId = urlParams.get('id');

    document.addEventListener("DOMContentLoaded", async () => {
      if (!storyId) return location.href = 'index.html';
      try {
        const doc = await db.collection("stories").doc(storyId).get();
        if (!doc.exists) return location.href = 'index.html';

        const data = doc.data();
        document.getElementById('storyTitleDisplay').innerText = data.title;
        document.getElementById('storyContentDisplay').innerText = data.content;

        db.collection("stories").doc(storyId).update({
          views: firebase.firestore.FieldValue.increment(1)
        });
      } catch (e) {
        console.error("Error loading story:", e);
      }
    });

    function setReaderTheme(theme) {
      const vp = document.getElementById('bookViewport');
      vp.className = 'book-viewport';
      if (theme !== 'light') vp.classList.add(`reader-${theme}`);
    }
  </script>
</body>
</html>
